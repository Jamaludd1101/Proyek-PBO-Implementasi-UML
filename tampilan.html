<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LokaMart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">

<style>
:root{--navy:#1B1F4B;--navy2:#2A2F6B;--coral:#FF5A4E;--sun:#FFD84D;--mint:#3DDBB0;--bg:#F4F3FF;--paper:#fff;--ink:#1B1F4B;--muted:#6A6E96;--line:#E1E0F5;--makanan:#FF9F43;--mainan:#8E6CF0;--minuman:#2FB8F0;--h:'Bricolage Grotesque',system-ui,sans-serif;--b:'Figtree',system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.5 var(--b)}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
.wrap{max-width:1000px;margin:auto;padding:0 16px}

.top{background:var(--navy);color:#fff;position:sticky;top:0;z-index:5}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:54px;gap:10px}
.logo{display:flex;align-items:center;gap:8px;font:800 23px var(--h);letter-spacing:-1px}
.logo i{width:32px;height:32px;border-radius:10px;background:var(--coral);display:grid;place-items:center;font-style:normal;transform:rotate(-8deg);box-shadow:3px 3px 0 var(--sun)}
.logo span{color:var(--sun)}
.akun{display:flex;align-items:center;gap:8px;font-weight:500;font-size:13px}
.saldo{background:var(--sun);color:var(--navy);font-weight:700;padding:5px 12px;border-radius:999px}
.ghost{background:none;border:1.5px solid #ffffff55;color:#fff;border-radius:999px;padding:5px 11px;font-size:12px}

.hero{background:var(--navy);color:#fff;padding:28px 0 70px;position:relative;overflow:hidden}
.hero .wrap{display:grid;grid-template-columns:1.2fr 1fr;gap:25px;align-items:center}
.hero h1{font:800 clamp(30px,3.5vw,43px)/1 var(--h);letter-spacing:-1.5px;margin:0 0 10px}
.hero h1 em{font-style:normal;background:var(--coral);padding:0 .15em;border-radius:10px;display:inline-block;transform:rotate(-2deg)}
.hero p{font-size:14px;color:#CFD0F2;max-width:46ch;margin:0 0 17px}
.ticket{display:inline-flex;align-items:stretch;border-radius:12px;background:var(--sun);color:var(--navy);border:0;padding:0;text-align:left;overflow:hidden}
.ticket b{font:800 18px var(--h);padding:9px 14px;border-right:2px dashed var(--navy)}
.ticket span{padding:9px 14px;font-weight:500;font-size:12px;display:grid;align-content:center}
.ticket:hover{transform:translateY(-2px)}

.blobs{position:relative;height:210px}
.blobs div{position:absolute;border-radius:50%;display:grid;place-items:center;font-size:50px}
.blobs .b1{width:155px;height:155px;background:var(--makanan);left:5%;top:18px}
.blobs .b2{width:120px;height:120px;background:var(--mainan);right:8%;top:0;font-size:42px}
.blobs .b3{width:140px;height:140px;background:var(--minuman);right:22%;bottom:0;font-size:48px}
.blobs .b4{width:55px;height:55px;background:var(--mint);left:0;bottom:5px;font-size:24px}

main.wrap{display:grid;grid-template-columns:1fr 240px;gap:16px;align-items:start;margin-top:-40px;position:relative;padding-bottom:40px}
.bar{background:var(--paper);border-radius:15px;padding:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;box-shadow:0 5px 0 var(--line);margin-bottom:16px}
.bar input[type=search]{flex:1;min-width:140px;border:0;background:var(--bg);border-radius:10px;padding:9px 12px;font-size:13px}
.chip{border:0;background:var(--bg);border-radius:999px;padding:7px 12px;font-weight:700;color:var(--muted);font-size:12px}
.chip[aria-pressed=true]{background:var(--navy);color:#fff}
.sep{width:2px;height:23px;background:var(--line)}
.tab{border:0;background:none;font-weight:700;color:var(--muted);padding:7px 9px;border-radius:999px;font-size:12px}
.tab[aria-selected=true]{color:var(--coral);background:#FFEDEB}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:12px}
.card{background:var(--paper);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 4px 0 var(--line);transition:transform .15s}
.card:hover{transform:translateY(-3px)}
.tile{height:90px;display:grid;place-items:center;font-size:42px;background:var(--c);position:relative}
.diskon{position:absolute;top:8px;right:8px;background:var(--coral);color:#fff;font:800 11px var(--h);padding:2px 8px;border-radius:999px;transform:rotate(4deg)}
.kat{position:absolute;left:8px;bottom:8px;background:#fff;color:var(--navy);font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px}
.body{padding:11px 12px 12px;display:flex;flex-direction:column;gap:2px;flex:1}
.body h3{font:800 15px/1.2 var(--h);margin:0}
.detail,.stok{font-size:11px;color:var(--muted)}
.stok.sedikit{color:var(--coral);font-weight:700}
.harga{display:flex;align-items:baseline;gap:6px;margin:6px 0 8px}
.harga strong{font:800 18px var(--h);letter-spacing:-.4px}
.harga s{color:var(--muted);font-size:11px}
.beli{display:flex;gap:6px;margin-top:auto}
.step{display:flex;align-items:center;background:var(--bg);border-radius:999px}
.step button{border:0;background:none;width:26px;height:34px;font-weight:800;font-size:16px}
.step output{min-width:20px;text-align:center;font-weight:700;font-size:12px}
.btn{border:0;border-radius:10px;background:var(--navy);color:#fff;font-weight:700;padding:8px 12px;font-size:12px}
.btn:hover{background:var(--navy2)}.btn.add{flex:1}.btn:disabled{background:#C9CAE6;cursor:not-allowed}

aside{position:sticky;top:70px;background:var(--paper);border-radius:17px;box-shadow:0 5px 0 var(--line);overflow:hidden}
aside header{background:var(--coral);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
aside header h2{font:800 18px var(--h);margin:0}
aside header span{background:#fff;color:var(--coral);font-weight:800;border-radius:999px;padding:0 8px;font-size:12px}
.in{padding:6px 16px 16px}
.item{display:grid;grid-template-columns:36px 1fr auto;gap:2px 9px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.item .em{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;font-size:19px;grid-row:1/3;background:var(--c)}
.item b{font-weight:700;line-height:1.2;font-size:12px}
.item small{color:var(--muted);font-size:10px}
.item .x{border:0;background:none;color:var(--coral);font-weight:700;grid-row:1/3;grid-column:3;font-size:11px}
.kosong{color:var(--muted);text-align:center;padding:20px 0;font-size:12px}
.voucher{display:flex;gap:6px;margin:11px 0}
.voucher input{flex:1;min-width:0;border:2px dashed var(--line);border-radius:999px;padding:7px 9px;text-transform:uppercase;font-size:11px}
.baris{display:flex;justify-content:space-between;padding:2px 0;font-size:12px}
.baris.hemat{color:#0E9F78;font-weight:700}
.baris.total{font:800 20px var(--h);margin-top:5px;padding-top:8px;border-top:2px solid var(--navy)}
.bayar{width:100%;margin-top:11px;background:var(--sun);color:var(--navy);font:800 15px var(--h);padding:10px;border-radius:11px;box-shadow:0 3px 0 #D9B52A}
.bayar:hover{background:#FFE06E}.bayar:disabled{background:#E7E7F3;box-shadow:none;color:#9A9CC0}

.panel{background:var(--paper);border-radius:16px;padding:18px;max-width:480px;box-shadow:0 4px 0 var(--line)}
.panel h2{font:800 21px var(--h);margin:0 0 5px}
label{display:block;font-weight:700;font-size:12px;margin:11px 0 4px}
.panel input,.panel select,dialog input{width:100%;border:2px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff;font-size:13px}
.struk{background:var(--bg);border-radius:12px;padding:12px;margin-bottom:11px}
.struk .t{font:800 13px var(--h);margin-bottom:5px}

dialog{border:0;border-radius:18px;padding:22px;max-width:360px;width:90%;box-shadow:0 20px 60px #1B1F4B66}
dialog::backdrop{background:#1B1F4BDD}
dialog h2{font:800 23px/1.1 var(--h);margin:0 0 5px;letter-spacing:-.7px}
.centang{width:52px;height:52px;border-radius:50%;background:var(--mint);display:grid;place-items:center;font-size:26px;margin-bottom:10px}
#toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,20px);background:var(--navy);color:#fff;padding:9px 16px;border-radius:11px;opacity:0;pointer-events:none;transition:.25s;max-width:90%;z-index:20;font-weight:500;font-size:12px}
#toast.on{opacity:1;transform:translate(-50%,0)}#toast.err{background:var(--coral)}

@media(max-width:900px){
.hero .wrap{grid-template-columns:1fr}.blobs{display:none}.hero{padding-bottom:60px}
main.wrap{grid-template-columns:1fr}aside{position:static;order:-1}.wrap{padding:0 14px}
}
@media(max-width:600px){
.logo{font-size:20px}.akun{font-size:11px}.ghost{padding:4px 8px}
.grid{grid-template-columns:repeat(2,1fr)}.bar{gap:6px}.sep{display:none}
}
</style>
</head>

<body>

<div class="top">
<div class="wrap">
<div class="logo"><i>L</i>Loka<span>Mart</span></div>
<div class="akun" id="akun"></div>
</div>
</div>

<section class="hero">
<div class="wrap">
<div>
<h1>Belanja lokal, <em>hemat</em> tiap hari.</h1>
<p>Makanan, mainan, dan minuman pilihan dengan diskon otomatis di setiap produk.</p>
<button class="ticket" id="tiket"><b>HEMAT5K</b><span>Potongan Rp5.000<br>klik untuk memakai</span></button>
</div>
<div class="blobs" aria-hidden="true">
<div class="b1">🍱</div><div class="b2">🧸</div><div class="b3">🥤</div><div class="b4">⭐</div>
</div>
</div>
</section>

<main class="wrap">
<section>

<div class="bar">
<input type="search" id="cari" placeholder="Cari produk di LokaMart" aria-label="Cari produk">
<div id="chips" style="display:flex;gap:5px;flex-wrap:wrap"></div>
<span class="sep"></span>
<button class="tab" data-tab="belanja" aria-selected="true">Belanja</button>
<button class="tab" data-tab="tambah" aria-selected="false">Tambah produk</button>
<button class="tab" data-tab="riwayat" aria-selected="false">Riwayat</button>
</div>

<div id="belanja"><div class="grid" id="produk"></div></div>

<div id="tambah" class="panel" hidden>
<h2>Tambah produk</h2>

<label for="fKat">Kategori</label>
<select id="fKat">
<option value="makanan">Makanan</option>
<option value="mainan">Mainan</option>
<option value="minuman">Minuman</option>
</select>

<label for="fNama">Nama produk</label>
<input id="fNama">

<label for="fHarga">Harga (Rp)</label>
<input id="fHarga" type="number" min="1">

<label for="fStok">Stok</label>
<input id="fStok" type="number" min="0">

<label for="fExtra" id="lExtra">Tanggal kadaluarsa</label>
<input id="fExtra" type="date">

<p><button class="btn bayar" id="simpanProduk">Simpan produk</button></p>
</div>

<div id="riwayat" hidden></div>
</section>

<aside>
<header><h2>Keranjang</h2><span id="jml">0</span></header>
<div class="in">
<div id="keranjang"></div>

<div class="voucher">
<input id="kodeVoucher" placeholder="Kode voucher" aria-label="Kode voucher">
<button class="btn" id="pakaiVoucher">Pakai</button>
</div>

<div class="baris"><span>Subtotal</span><span id="subtotal">Rp0</span></div>

<div class="baris hemat" id="barisPotongan" hidden>
<span>Voucher <span id="kodeAktif"></span></span>
<span id="potongan"></span>
</div>

<div class="baris total"><span>Total</span><span id="total">Rp0</span></div>
<button class="btn bayar" id="bayar">Bayar sekarang</button>
</div>
</aside>
</main>

<dialog id="login">
<h2>Selamat datang di LokaMart</h2>
<p style="margin-top:0;color:var(--muted)">Isi data pembeli untuk mulai belanja.</p>

<label for="lNama">Nama pembeli</label>
<input id="lNama" autocomplete="off">

<label for="lSaldo">Saldo awal (Rp)</label>
<input id="lSaldo" type="text" inputmode="numeric" autocomplete="off">

<p><button class="btn bayar" id="mulai">Mulai belanja</button></p>
</dialog>

<dialog id="dStruk">
<div class="centang">✓</div>
<h2>Pembayaran berhasil</h2>
<div id="isiStruk" style="margin-top:12px"></div>
<button class="btn bayar" id="tutupStruk">Lanjut belanja</button>
</dialog>

<div id="toast" role="status"></div>

<script>
const produkAwal=[
{kategori:"Makanan",nama:"Oreo 133g",harga:10000,stok:47,kadaluarsa:"25-12-2026"},
{kategori:"Makanan",nama:"Sari Roti Gandum",harga:18000,stok:19,kadaluarsa:"10-10-2026"},
{kategori:"Makanan",nama:"Indomie Goreng",harga:3500,stok:199,kadaluarsa:"15-08-2027"},
{kategori:"Makanan",nama:"Chitato Sapi Panggang",harga:12500,stok:40,kadaluarsa:"20-11-2026"},
{kategori:"Makanan",nama:"Beng-Beng Coklat",harga:2500,stok:100,kadaluarsa:"05-05-2027"},
{kategori:"Minuman",nama:"Aqua Air Mineral",harga:3500,stok:150,ukuran_ml:600},
{kategori:"Minuman",nama:"Pocari Sweat",harga:8000,stok:60,ukuran_ml:500},
{kategori:"Minuman",nama:"Coca Cola",harga:6500,stok:45,ukuran_ml:390},
{kategori:"Minuman",nama:"Susu Ultra Coklat",harga:7000,stok:80,ukuran_ml:250},
{kategori:"Minuman",nama:"Teh Pucuk Harum",harga:4000,stok:120,ukuran_ml:350},
{kategori:"Mainan",nama:"Hot Wheels Reguler",harga:35000,stok:25,rekomendasi_umur:3},
{kategori:"Mainan",nama:"Lego Classic Blocks",harga:150000,stok:10,rekomendasi_umur:4},
{kategori:"Mainan",nama:"Rubik 3x3",harga:45000,stok:15,rekomendasi_umur:7},
{kategori:"Mainan",nama:"Kartu Uno",harga:25000,stok:30,rekomendasi_umur:7},
{kategori:"Mainan",nama:"Boneka Beruang Mini",harga:60000,stok:12,rekomendasi_umur:2}
];

let produk=JSON.parse(localStorage.getItem("lokamart_produk"));
if(!produk){produk=produkAwal;localStorage.setItem("lokamart_produk",JSON.stringify(produk))}
let pembeli=JSON.parse(localStorage.getItem("lokamart_pembeli"))||null;
let keranjang=JSON.parse(localStorage.getItem("lokamart_keranjang"))||[];
let riwayat=JSON.parse(localStorage.getItem("lokamart_riwayat"))||[];
let voucherAktif=false,filter="Semua",timer;

const $=s=>document.querySelector(s);
const rupiah=angka=>"Rp"+Number(angka).toLocaleString("id-ID");

function simpanData(){
localStorage.setItem("lokamart_produk",JSON.stringify(produk));
localStorage.setItem("lokamart_pembeli",JSON.stringify(pembeli));
localStorage.setItem("lokamart_keranjang",JSON.stringify(keranjang));
localStorage.setItem("lokamart_riwayat",JSON.stringify(riwayat));
}

function toast(pesan,error=false){
const t=$("#toast");t.textContent=pesan;t.className="on"+(error?" err":"");
clearTimeout(timer);timer=setTimeout(()=>t.className="",3000);
}

function hargaAkhir(p){
if(p.kategori==="Makanan"||p.kategori==="Mainan")return Math.round(p.harga*.9);
if(p.kategori==="Minuman")return Math.round(p.harga*.95);
return p.harga;
}

const KAT={
Makanan:{c:"#FF9F43",e:"🍱"},
Mainan:{c:"#8E6CF0",e:"🧸"},
Minuman:{c:"#2FB8F0",e:"🥤"}
};

function detail(p){
if(p.kategori==="Makanan")return"Kadaluarsa "+p.kadaluarsa;
if(p.kategori==="Mainan")return"Untuk umur "+p.rekomendasi_umur+"+";
return p.ukuran_ml+" ml";
}

function renderAkun(){
if(!pembeli){$("#akun").innerHTML="";return}
$("#akun").innerHTML=`<span>${pembeli.nama}</span><span class="saldo">${rupiah(pembeli.saldo)}</span><button class="ghost" id="keluar">Ganti pembeli</button>`;
$("#keluar").onclick=()=>{
pembeli=null;keranjang=[];voucherAktif=false;simpanData();bukaLogin();render();
};
}

function renderChips(){
const kategori=["Semua","Makanan","Mainan","Minuman"];
$("#chips").innerHTML=kategori.map(k=>{
const jumlah=k==="Semua"?produk.length:produk.filter(p=>p.kategori===k).length;
return`<button class="chip" data-filter="${k}" aria-pressed="${k===filter}">${k} ${jumlah}</button>`;
}).join("");
}

function renderProduk(){
const pencarian=$("#cari").value.trim().toLowerCase();
const daftar=produk.filter(p=>(filter==="Semua"||p.kategori===filter)&&p.nama.toLowerCase().includes(pencarian));

if(!daftar.length){
$("#produk").innerHTML=`<p class="kosong">Tidak ada produk yang cocok.<br>Coba kata kunci lain atau tambah produk baru.</p>`;
return;
}

$("#produk").innerHTML=daftar.map(p=>{
const harga=hargaAkhir(p),diskon=Math.round((p.harga-harga)/p.harga*100);
return`
<article class="card" style="--c:${KAT[p.kategori].c}">
<div class="tile">${KAT[p.kategori].e}<span class="diskon">-${diskon}%</span><span class="kat">${p.kategori}</span></div>
<div class="body">
<h3>${p.nama}</h3>
<span class="detail">${detail(p)}</span>
<div class="harga"><strong>${rupiah(harga)}</strong><s>${rupiah(p.harga)}</s></div>
<span class="stok ${p.stok<=5?"sedikit":""}">${p.stok===0?"Stok habis":p.stok<=5?"Tinggal "+p.stok:"Stok "+p.stok}</span>
<div class="beli">
<div class="step"><button data-minus="${p.nama}">−</button><output>1</output><button data-plus="${p.nama}">+</button></div>
<button class="btn add" data-add="${p.nama}" ${p.stok===0?"disabled":""}>Tambah</button>
</div>
</div>
</article>`;
}).join("");
}

function renderKeranjang(){
if(!keranjang.length){
$("#keranjang").innerHTML=`<p class="kosong">Keranjang masih kosong.<br>Pilih produk di sebelah kiri.</p>`;
}else{
$("#keranjang").innerHTML=keranjang.map(item=>{
const p=produk.find(x=>x.nama===item.nama);
const kategori=p?KAT[p.kategori]:{c:"#eee",e:"🛒"};
return`
<div class="item" style="--c:${kategori.c}">
<span class="em">${kategori.e}</span>
<b>${item.nama}</b>
<button class="x" data-hapus="${item.nama}">Hapus</button>
<small>${item.jumlah} x ${rupiah(item.harga)} = ${rupiah(item.jumlah*item.harga)}</small>
</div>`;
}).join("");
}

const jumlah=keranjang.reduce((t,i)=>t+i.jumlah,0);
const subtotal=keranjang.reduce((t,i)=>t+i.jumlah*i.harga,0);
const potongan=voucherAktif?Math.min(5000,subtotal):0;
const total=subtotal-potongan;

$("#jml").textContent=jumlah;
$("#subtotal").textContent=rupiah(subtotal);
$("#total").textContent=rupiah(total);
$("#barisPotongan").hidden=!(voucherAktif&&potongan>0);
$("#kodeAktif").textContent=voucherAktif?" HEMAT5K":"";
$("#potongan").textContent="-"+rupiah(potongan);
$("#bayar").disabled=!keranjang.length;
}

function render(){
renderAkun();renderChips();renderProduk();renderKeranjang();
}

function bukaLogin(){
if(!$("#login").open)$("#login").showModal();
}

$("#mulai").onclick=()=>{
const nama=$("#lNama").value.trim();
const saldoText=$("#lSaldo").value.replace(/\./g,"");
const saldo=Number(saldoText);

if(!nama)return toast("Nama pembeli harus diisi.",true);
if(!saldoText||isNaN(saldo))return toast("Saldo harus diisi.",true);
if(saldo<0)return toast("Saldo tidak boleh negatif.",true);

pembeli={nama,saldo};keranjang=[];voucherAktif=false;simpanData();
$("#login").close();render();toast("Selamat datang, "+nama);
};

$("#lSaldo").addEventListener("input",e=>{
const angka=e.target.value.replace(/\D/g,"");
e.target.value=angka?Number(angka).toLocaleString("id-ID"):"";
});

function tambahKeranjang(nama,jumlah){
if(!pembeli){bukaLogin();return}
const p=produk.find(x=>x.nama===nama);
if(!p)return toast("Produk tidak ditemukan.",true);
if(jumlah>p.stok)return toast("Jumlah melebihi stok.",true);

const sudahAda=keranjang.find(x=>x.nama===nama);

if(sudahAda){
sudahAda.jumlah+=jumlah;
if(sudahAda.jumlah>p.stok){
sudahAda.jumlah=p.stok;
toast("Jumlah sudah mencapai stok maksimum.",true);
}
}else keranjang.push({nama,jumlah,harga:hargaAkhir(p)});

simpanData();renderKeranjang();toast(nama+" berhasil masuk ke keranjang.");
}

function hapusKeranjang(nama){
keranjang=keranjang.filter(x=>x.nama!==nama);
simpanData();renderKeranjang();toast(nama+" dihapus dari keranjang.");
}

document.addEventListener("click",e=>{
const filterButton=e.target.closest("[data-filter]");
if(filterButton){
filter=filterButton.dataset.filter;renderChips();renderProduk();return;
}

const tombolTambah=e.target.closest("[data-add]");
if(tombolTambah){
const card=tombolTambah.closest(".card");
const jumlah=Number(card.querySelector("output").textContent);
tambahKeranjang(tombolTambah.dataset.add,jumlah);return;
}

const tombolHapus=e.target.closest("[data-hapus]");
if(tombolHapus){hapusKeranjang(tombolHapus.dataset.hapus);return}

const minus=e.target.closest("[data-minus]");
if(minus){
const output=minus.closest(".card").querySelector("output");
output.textContent=Math.max(1,Number(output.textContent)-1);return;
}

const plus=e.target.closest("[data-plus]");
if(plus){
const card=plus.closest(".card"),output=card.querySelector("output");
let jumlah=Number(output.textContent);
const p=produk.find(x=>x.nama===plus.dataset.plus);
if(p)jumlah=Math.min(p.stok,jumlah+1);
output.textContent=jumlah;
}
});

$("#cari").addEventListener("input",renderProduk);

const LABEL={
makanan:["Tanggal kadaluarsa","date"],
mainan:["Rekomendasi umur","number"],
minuman:["Ukuran (ml)","number"]
};

$("#fKat").onchange=e=>{
const data=LABEL[e.target.value];
$("#lExtra").textContent=data[0];
$("#fExtra").type=data[1];
$("#fExtra").value="";
};

$("#simpanProduk").onclick=()=>{
const kategori=$("#fKat").value;
const nama=$("#fNama").value.trim();
const harga=Number($("#fHarga").value);
const stok=Number($("#fStok").value);
const extra=$("#fExtra").value;

if(!nama)return toast("Nama produk harus diisi.",true);
if(!harga||harga<=0)return toast("Harga harus lebih dari 0.",true);
if(isNaN(stok)||stok<0)return toast("Stok tidak boleh negatif.",true);

if(produk.some(p=>p.nama.toLowerCase()===nama.toLowerCase()))
return toast("Produk tersebut sudah ada.",true);

const produkBaru={
nama,
harga,
stok,
kategori:kategori==="makanan"?"Makanan":kategori==="mainan"?"Mainan":"Minuman"
};

if(kategori==="makanan")produkBaru.kadaluarsa=extra||"-";
if(kategori==="mainan")produkBaru.rekomendasi_umur=Number(extra)||0;
if(kategori==="minuman")produkBaru.ukuran_ml=Number(extra)||0;

produk.push(produkBaru);

if(stok>0){
keranjang.push({
nama,
jumlah:1,
harga:hargaAkhir(produkBaru)
});
}

simpanData();

$("#fNama").value="";
$("#fHarga").value="";
$("#fStok").value="";
$("#fExtra").value="";

document.querySelectorAll("[data-tab]").forEach(button=>{
button.setAttribute("aria-selected",button.dataset.tab==="belanja");
});

$("#belanja").hidden=false;
$("#tambah").hidden=true;
$("#riwayat").hidden=true;

filter="Semua";
render();
toast(nama+" berhasil ditambahkan dan masuk ke keranjang.");
};

document.querySelectorAll("[data-tab]").forEach(button=>{
button.onclick=()=>{
document.querySelectorAll("[data-tab]").forEach(x=>{
x.setAttribute("aria-selected",x===button);
});

const tab=button.dataset.tab;
$("#belanja").hidden=tab!=="belanja";
$("#tambah").hidden=tab!=="tambah";
$("#riwayat").hidden=tab!=="riwayat";

if(tab==="riwayat")renderRiwayat();
};
});

function gunakanVoucher(kode){
if(!pembeli){bukaLogin();return}
if(kode!=="HEMAT5K")return toast("Voucher tidak ditemukan.",true);

const subtotal=keranjang.reduce((t,i)=>t+i.jumlah*i.harga,0);
if(subtotal<5000)return toast("Minimal belanja Rp5.000.",true);

voucherAktif=true;renderKeranjang();toast("Voucher HEMAT5K berhasil dipasang.");
}

$("#pakaiVoucher").onclick=()=>gunakanVoucher($("#kodeVoucher").value.trim().toUpperCase());
$("#tiket").onclick=()=>gunakanVoucher("HEMAT5K");

function buatStruk(){
const subtotal=keranjang.reduce((t,i)=>t+i.jumlah*i.harga,0);
const potongan=voucherAktif?Math.min(5000,subtotal):0;
const total=subtotal-potongan;

return{
waktu:new Date().toLocaleString("id-ID"),
pembeli:pembeli.nama,
items:keranjang.map(item=>({
nama:item.nama,
qty:item.jumlah,
harga_satuan:item.harga,
subtotal:item.jumlah*item.harga
})),
subtotal,
potongan,
total_bayar:total
};
}

function strukHTML(struk){
return`
<div class="struk">
<div class="t">${struk.pembeli} · ${struk.waktu}</div>
${struk.items.map(item=>`
<div class="baris"><span>${item.nama} x${item.qty}</span><span>${rupiah(item.subtotal)}</span></div>
`).join("")}
<div class="baris"><span>Subtotal</span><span>${rupiah(struk.subtotal)}</span></div>
${struk.potongan>0?`
<div class="baris hemat"><span>Potongan</span><span>-${rupiah(struk.potongan)}</span></div>`:""}
<div class="baris total"><span>Total bayar</span><span>${rupiah(struk.total_bayar)}</span></div>
</div>`;
}

$("#bayar").onclick=()=>{
if(!pembeli){bukaLogin();return}
if(!keranjang.length)return toast("Keranjang masih kosong.",true);

const struk=buatStruk();

if(pembeli.saldo<struk.total_bayar)
return toast("Saldo tidak cukup untuk pembayaran.",true);

pembeli.saldo-=struk.total_bayar;

keranjang.forEach(item=>{
const p=produk.find(x=>x.nama===item.nama);
if(p)p.stok=Math.max(0,p.stok-item.jumlah);
});

riwayat.push(struk);
keranjang=[];
voucherAktif=false;

simpanData();
$("#isiStruk").innerHTML=strukHTML(struk);
$("#dStruk").showModal();
render();
};

$("#tutupStruk").onclick=()=>$("#dStruk").close();

function renderRiwayat(){
if(!riwayat.length){
$("#riwayat").innerHTML=`<p class="kosong">Belum ada riwayat transaksi.</p>`;
return;
}
$("#riwayat").innerHTML=riwayat.slice().reverse().map(strukHTML).join("");
}

if(!pembeli)setTimeout(bukaLogin,100);
render();
</script>
</body>
</html>
